<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry Showdown - Chapter 1 Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#0F3D2E; --pitch2:#145239; --chalk:#F5F7F2; --ink:#14221C;
  --red:#D7263D; --blue:#1F6FEB; --gold:#F2B705; --ok:#1E9E57; --bad:#C62828;
  --head:'Lilita One','Trebuchet MS',Impact,sans-serif; --body:'Nunito','Trebuchet MS',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);font-weight:600;color:var(--chalk);background:var(--pitch);
  background-image:repeating-linear-gradient(90deg,var(--pitch) 0 90px,var(--pitch2) 90px 180px);overflow-x:hidden}
h1,h2,h3,.head{font-family:var(--head);font-weight:400;letter-spacing:.5px;margin:0}
button{font-family:var(--body);font-weight:800;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.screen{display:none;min-height:100%;padding:24px;max-width:1100px;margin:0 auto}
.screen.on{display:block}

/* setup */
.title{text-align:center;padding:18px 0 8px}
.title h1{font-size:clamp(38px,7vw,72px);line-height:1}
.title p{font-size:clamp(16px,2.2vw,22px);margin:10px 0 0;opacity:.9}
.tabs{display:flex;gap:10px;justify-content:center;margin:18px 0}
.tab{background:rgba(255,255,255,.12);color:var(--chalk);padding:12px 26px;border-radius:12px;font-size:18px}
.tab.sel{background:var(--chalk);color:var(--ink)}
.panel{background:var(--chalk);color:var(--ink);border-radius:18px;padding:22px;max-width:820px;margin:0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.teamset label{display:block;font-weight:800;margin-bottom:6px}
.teamset input,.teamset textarea,.codebox input{width:100%;font:inherit;font-weight:700;padding:11px 12px;border-radius:10px;border:3px solid #c9d2cc;background:#fff}
.teamset textarea{min-height:92px;resize:vertical}
.t-red{border-top:10px solid var(--red);padding-top:12px}
.t-blue{border-top:10px solid var(--blue);padding-top:12px}
.hint{font-size:14px;opacity:.75;margin-top:6px}
.codebox{display:flex;gap:10px;flex-wrap:wrap}
.codebox input{flex:1;min-width:180px;font-size:22px;text-transform:uppercase;letter-spacing:2px}
.btn{background:var(--gold);color:var(--ink);padding:14px 30px;border-radius:14px;font-size:20px;box-shadow:0 5px 0 #b88b00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b88b00}
.btn.alt{background:var(--ink);color:var(--chalk);box-shadow:0 5px 0 #000}
.go{text-align:center;margin-top:22px}
#loadMsg{margin-top:12px;font-weight:800}
#loadMsg.err{color:var(--bad)}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.roster div{border-radius:12px;padding:10px 12px;font-size:15px}
.roster .r{background:#fde7ea;border-left:8px solid var(--red)}
.roster .b{background:#e5eefe;border-left:8px solid var(--blue)}

/* play */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-bottom:16px}
.score{border-radius:16px;padding:10px 18px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;border:5px solid transparent;transition:transform .2s,border-color .2s}
.score.red{background:var(--red)} .score.blue{background:var(--blue)}
.score.turn{border-color:var(--gold);transform:scale(1.04)}
.score .nm{font-family:var(--head);font-size:clamp(18px,2.6vw,30px);line-height:1.05}
.score .who{font-size:14px;opacity:.95}
.score .pts{font-family:var(--head);font-size:clamp(36px,6vw,64px);line-height:1}
.pts.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.round{display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--head);font-size:20px;min-width:90px;opacity:.95}
.round b{font-size:34px;font-weight:400}
.qcard{background:var(--chalk);color:var(--ink);border-radius:22px;padding:22px 24px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.turnline{font-family:var(--head);font-size:clamp(20px,3vw,30px);margin-bottom:6px}
.turnline.red{color:var(--red)} .turnline.blue{color:var(--blue)}
.qtext{font-size:clamp(22px,3.4vw,36px);font-weight:800;line-height:1.2;margin:4px 0 10px}
.fig{display:flex;justify-content:center;margin:6px 0 12px;min-height:10px}
.fig svg{max-width:100%;height:auto;background:#fff;border:3px solid #dfe6e1;border-radius:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{background:#fff;color:var(--ink);border:4px solid #c9d2cc;border-radius:16px;padding:16px 14px;font-size:clamp(20px,3vw,32px);text-align:left;display:flex;gap:12px;align-items:center;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ink)}
.opt .l{background:var(--ink);color:#fff;border-radius:10px;min-width:42px;height:42px;display:grid;place-items:center;font-family:var(--head)}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.good .l{background:#fff;color:var(--ok)}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .4s}
.opt.wrong .l{background:#fff;color:var(--bad)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:54px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb .msg{font-family:var(--head);font-size:clamp(22px,3.4vw,34px)}
.fb .msg.ok{color:var(--ok)} .fb .msg.no{color:var(--bad)}
.why{font-size:16px;opacity:.85;flex-basis:100%}
.topbar{display:flex;justify-content:space-between;margin-top:14px}
.small{background:rgba(255,255,255,.14);color:var(--chalk);border-radius:10px;padding:8px 14px;font-size:15px}

/* end */
.endcard{text-align:center;padding-top:30px}
.endcard h2{font-size:clamp(34px,6vw,64px)}
.final{display:flex;gap:18px;justify-content:center;margin:24px 0;flex-wrap:wrap}
.final div{border-radius:18px;padding:18px 34px;min-width:230px}
.final .r{background:var(--red)} .final .b{background:var(--blue)}
.final .big{font-family:var(--head);font-size:68px;line-height:1}
.final .win{outline:6px solid var(--gold)}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0}
.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:.45}100%{opacity:0}}
@media(max-width:720px){.two,.opts,.roster{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}.round{grid-column:1/-1;flex-direction:row;gap:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="flash" id="flash"></div>

<!-- SETUP -->
<section class="screen on" id="setup">
  <div class="title">
    <h1>Geometry Showdown</h1>
    <p>Chapter 1 revision: lines, angles and fractals. Two teams, 12 questions, one winner.</p>
  </div>
  <div class="tabs">
    <button class="tab sel" id="tabManual">Manual</button>
    <button class="tab" id="tabAuto">Auto (class code)</button>
  </div>

  <div class="panel" id="manualPanel">
    <div class="two">
      <div class="teamset t-red">
        <label for="nameR">Red team name</label>
        <input id="nameR" value="Red Team" maxlength="24">
        <label for="stuR" style="margin-top:12px">Students (optional, one per line)</label>
        <textarea id="stuR" placeholder="Type names to call each student in turn"></textarea>
      </div>
      <div class="teamset t-blue">
        <label for="nameB">Blue team name</label>
        <input id="nameB" value="Blue Team" maxlength="24">
        <label for="stuB" style="margin-top:12px">Students (optional, one per line)</label>
        <textarea id="stuB" placeholder="Type names to call each student in turn"></textarea>
      </div>
    </div>
    <div class="go"><button class="btn" id="startManual">Start game</button></div>
  </div>

  <div class="panel" id="autoPanel" style="display:none">
    <label for="code" style="font-weight:800">Class code</label>
    <div class="codebox" style="margin-top:6px">
      <input id="code" placeholder="e.g. 5A2026" autocomplete="off">
      <button class="btn alt" id="loadBtn">Load class</button>
    </div>
    <div id="loadMsg"></div>
    <div class="roster" id="roster" style="display:none"></div>
    <div class="hint">All students in the class are merged and split at random into two teams, Red and Blue.</div>
    <div class="go" id="autoGo" style="display:none"><button class="btn" id="startAuto">Start game</button></div>
  </div>
</section>

<!-- PLAY -->
<section class="screen" id="play">
  <div class="board">
    <div class="score red" id="sR"><div><div class="nm" id="nR"></div><div class="who" id="wR"></div></div><div class="pts" id="pR">0</div></div>
    <div class="round"><span>Question</span><b id="rnd">1/12</b></div>
    <div class="score blue" id="sB"><div class="pts" id="pB">0</div><div style="text-align:right"><div class="nm" id="nB"></div><div class="who" id="wB"></div></div></div>
  </div>
  <div class="qcard">
    <div class="turnline" id="turn"></div>
    <div class="qtext" id="qtext"></div>
    <div class="fig" id="fig"></div>
    <div class="opts" id="opts"></div>
    <div class="fb"><div class="msg" id="msg"></div><button class="btn" id="next" style="display:none">Next question</button><div class="why" id="why"></div></div>
  </div>
  <div class="topbar">
    <button class="small" id="quit">Back to start</button>
    <button class="small" id="mute">Sound: on</button>
  </div>
</section>

<!-- END -->
<section class="screen" id="end">
  <div class="endcard">
    <h2 id="endTitle"></h2>
    <div class="final">
      <div class="r" id="fR"></div>
      <div class="b" id="fB"></div>
    </div>
    <button class="btn" id="again">Play again</button>
    <button class="btn alt" id="home" style="margin-left:10px">Change teams</button>
  </div>
</section>

<script>
/* ================= FIREBASE (Auto mode) =================
   Paste the same Realtime Database URL you use in Dream Team Penalty.
   If your classes are stored under a different path, change classPath(). */
const FIREBASE_DB_URL = "PASTE_YOUR_FIREBASE_DATABASE_URL_HERE";
const classPath = code => "classes/" + code;

/* ================= QUESTIONS ================= */
const Q = [
 {q:"What is this figure called?", fig:{t:"ray"}, o:["Line","Line segment","Ray","Point"], a:2, why:"A ray has one end point and goes on forever in one direction."},
 {q:"Which of these has two end points?", o:["Line","Ray","Line segment","Angle"], a:2, why:"A line segment is a part of a line between two end points."},
 {q:"Line PQ and line QP are ...", fig:{t:"line"}, o:["different lines","the same line","two rays","two points"], a:1, why:"Both names describe the same line."},
 {q:"The shortest distance between two points is shown by ...", o:["a curve","a zigzag path","a line segment","a wavy line"], a:2, why:"The straight line segment is the shortest path."},
 {q:"What type of angle is this?", fig:{t:"angle",d:90}, o:["Acute angle","Right angle","Obtuse angle","Straight angle"], a:1, why:"A right angle is exactly 90 degrees."},
 {q:"What type of angle is this?", fig:{t:"angle",d:35}, o:["Acute angle","Right angle","Obtuse angle","Straight angle"], a:0, why:"An acute angle is between 0 and 90 degrees."},
 {q:"What type of angle is this?", fig:{t:"angle",d:130}, o:["Acute angle","Right angle","Obtuse angle","Straight angle"], a:2, why:"An obtuse angle is between 90 and 180 degrees."},
 {q:"What type of angle is this?", fig:{t:"angle",d:180}, o:["Right angle","Obtuse angle","Zero angle","Straight angle"], a:3, why:"A straight angle is exactly 180 degrees."},
 {q:"What is the complementary angle of 40°?", o:["40°","50°","140°","60°"], a:1, why:"Complementary angles add up to 90°, and 40° + 50° = 90°."},
 {q:"What is the supplementary angle of 70°?", o:["20°","90°","110°","120°"], a:2, why:"Supplementary angles add up to 180°, and 70° + 110° = 180°."},
 {q:"Which pair of angles is complementary?", o:["100° and 80°","25° and 65°","45° and 55°","60° and 60°"], a:1, why:"25° + 65° = 90°. The pair 100° and 80° adds to 180° (supplementary)."},
 {q:"This pattern repeats the same shape again and again in smaller sizes. It is called a ...", fig:{t:"fractal"}, o:["ray","fractal","right angle","line segment"], a:1, why:"A fractal is a never ending pattern that repeats itself. This is called self-similarity."}
];

/* ================= FIGURES (SVG) ================= */
const INK="#14221C";
function pt(x,y,d,L){const a=d*Math.PI/180;return [x+L*Math.cos(a),y-L*Math.sin(a)]}
function arrow(x,y,d){ // arrowhead at (x,y) pointing in direction d (deg)
  const [x1,y1]=pt(x,y,d+180+22,14),[x2,y2]=pt(x,y,d+180-22,14);
  return `<polygon points="${x},${y} ${x1},${y1} ${x2},${y2}" fill="${INK}"/>`;
}
function figure(f){
  let s="";
  if(f.t==="ray"){
    s=`<svg viewBox="0 0 360 110" width="360"><line x1="50" y1="55" x2="320" y2="55" stroke="${INK}" stroke-width="4"/>${arrow(330,55,0)}<circle cx="50" cy="55" r="7" fill="${INK}"/></svg>`;
  }else if(f.t==="line"){
    s=`<svg viewBox="0 0 360 120" width="360"><line x1="30" y1="55" x2="330" y2="55" stroke="${INK}" stroke-width="4"/>${arrow(340,55,0)}${arrow(20,55,180)}
    <circle cx="120" cy="55" r="6" fill="${INK}"/><circle cx="250" cy="55" r="6" fill="${INK}"/>
    <text x="120" y="90" text-anchor="middle" font-size="24" font-weight="800">P</text><text x="250" y="90" text-anchor="middle" font-size="24" font-weight="800">Q</text></svg>`;
  }else if(f.t==="angle"){
    const d=f.d,vx=d===180?190:90,vy=d===180?110:150;
    let body="";
    if(d===180){
      body=`<line x1="40" y1="${vy}" x2="340" y2="${vy}" stroke="${INK}" stroke-width="4"/>${arrow(350,vy,0)}${arrow(30,vy,180)}
      <path d="M ${vx-30} ${vy} A 30 30 0 0 1 ${vx+30} ${vy}" fill="none" stroke="${INK}" stroke-width="3"/>`;
    }else{
      const [ex,ey]=pt(vx,vy,d,190),[bx,by]=pt(vx,vy,0,230);
      body=`<line x1="${vx}" y1="${vy}" x2="${bx}" y2="${by}" stroke="${INK}" stroke-width="4"/>${arrow(bx+8,by,0)}
      <line x1="${vx}" y1="${vy}" x2="${ex}" y2="${ey}" stroke="${INK}" stroke-width="4"/>${arrow(ex+8*Math.cos(d*Math.PI/180),ey-8*Math.sin(d*Math.PI/180),d)}`;
      if(d===90) body+=`<path d="M ${vx+22} ${vy} L ${vx+22} ${vy-22} L ${vx} ${vy-22}" fill="none" stroke="${INK}" stroke-width="3"/>`;
      else{const [a1x,a1y]=pt(vx,vy,0,36),[a2x,a2y]=pt(vx,vy,d,36);body+=`<path d="M ${a1x} ${a1y} A 36 36 0 0 0 ${a2x} ${a2y}" fill="none" stroke="${INK}" stroke-width="3"/>`;}
      body+=`<circle cx="${vx}" cy="${vy}" r="6" fill="${INK}"/>`;
    }
    s=`<svg viewBox="0 0 380 ${d===180?150:190}" width="380">${body}</svg>`;
  }else if(f.t==="fractal"){
    let tris="";
    (function sier(x,y,size,dep){
      const h=size*Math.sqrt(3)/2;
      if(dep===0){tris+=`<polygon points="${x},${y} ${x+size},${y} ${x+size/2},${y-h}" fill="#D7263D" stroke="${INK}" stroke-width="1"/>`;return}
      sier(x,y,size/2,dep-1);sier(x+size/2,y,size/2,dep-1);sier(x+size/4,y-h/2,size/2,dep-1);
    })(75,176,190,4);
    s=`<svg viewBox="0 0 340 185" width="340">${tris}</svg>`;
  }
  return s;
}

/* ================= SOUND ================= */
let AC=null,soundOn=true;
function tone(f,t,d,type,v){
  if(!soundOn)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(v||.15,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);
  o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.02);}catch(e){}
}
const sndOk=()=>{tone(523,0,.15,"triangle");tone(659,.12,.15,"triangle");tone(784,.24,.3,"triangle")};
const sndNo=()=>{tone(200,0,.25,"sawtooth",.1);tone(150,.2,.3,"sawtooth",.1)};
const sndWin=()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.16,.25,"triangle"))};

/* ================= STATE ================= */
const $=id=>document.getElementById(id);
let mode="manual", teams=[], order=[], qi=0, locked=false, autoTeams=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0)}

/* ---- setup ---- */
$("tabManual").onclick=()=>{mode="manual";$("tabManual").classList.add("sel");$("tabAuto").classList.remove("sel");$("manualPanel").style.display="";$("autoPanel").style.display="none"};
$("tabAuto").onclick=()=>{mode="auto";$("tabAuto").classList.add("sel");$("tabManual").classList.remove("sel");$("autoPanel").style.display="";$("manualPanel").style.display="none"};
const lines=v=>v.split("\n").map(s=>s.trim()).filter(Boolean);

$("startManual").onclick=()=>{
  teams=[{name:$("nameR").value.trim()||"Red Team",cls:"red",score:0,stu:lines($("stuR").value),i:0},
         {name:$("nameB").value.trim()||"Blue Team",cls:"blue",score:0,stu:lines($("stuB").value),i:0}];
  startGame();
};

function walk(n,out){
  if(n==null)return;
  if(Array.isArray(n)){n.forEach(x=>typeof x==="string"?out.push(x.trim()):walk(x,out));return}
  if(typeof n==="object"){
    const lk=["students","members","players","names"].find(k=>n[k]!=null);
    if(lk){walk(n[lk],out);return}
    if(typeof n.name==="string"&&Object.values(n).every(v=>typeof v!=="object")){out.push(n.name.trim());return}
    Object.values(n).forEach(v=>{if(v&&typeof v==="object")walk(v,out)});
  }
}
$("loadBtn").onclick=async()=>{
  const code=$("code").value.trim();const msg=$("loadMsg");msg.className="";
  if(!code){msg.className="err";msg.textContent="Type the class code first.";return}
  if(FIREBASE_DB_URL.indexOf("PASTE_")===0){msg.className="err";msg.textContent="Add your Firebase database URL at the top of the script (FIREBASE_DB_URL).";return}
  msg.textContent="Loading class...";
  try{
    const r=await fetch(FIREBASE_DB_URL.replace(/\/$/,"")+"/"+classPath(code)+".json");
    if(!r.ok)throw new Error("HTTP "+r.status);
    const data=await r.json();
    if(data==null){msg.className="err";msg.textContent="No class found for that code. Check the code and try again.";return}
    let names=[];walk(data,names);
    names=[...new Set(names.filter(Boolean))];
    if(!names.length){msg.className="err";msg.textContent="The class loaded, but no student names were found. Check classPath() in the script.";return}
    names=shuffle(names);
    const R=[],B=[];names.forEach((n,i)=>(i%2?B:R).push(n));
    autoTeams={R,B};
    msg.textContent=names.length+" students loaded.";
    $("roster").style.display="";
    $("roster").innerHTML=`<div class="r"><b>Red (${R.length})</b><br>${R.join(", ")}</div><div class="b"><b>Blue (${B.length})</b><br>${B.join(", ")}</div>`;
    $("autoGo").style.display="";
  }catch(e){msg.className="err";msg.textContent="Could not load the class. Check your internet and the database URL.";}
};
$("startAuto").onclick=()=>{
  teams=[{name:"Red Team",cls:"red",score:0,stu:autoTeams.R,i:0},{name:"Blue Team",cls:"blue",score:0,stu:autoTeams.B,i:0}];
  startGame();
};

/* ---- game ---- */
function startGame(){
  teams.forEach(t=>{t.score=0;t.i=0});
  order=shuffle(Q);qi=0;
  $("nR").textContent=teams[0].name;$("nB").textContent=teams[1].name;
  $("pR").textContent=0;$("pB").textContent=0;
  show("play");loadQ();
}
function loadQ(){
  locked=false;const q=order[qi],ti=qi%2,t=teams[ti];
  $("rnd").textContent=(qi+1)+"/"+order.length;
  $("sR").classList.toggle("turn",ti===0);$("sB").classList.toggle("turn",ti===1);
  const who=t.stu.length?t.stu[t.i%t.stu.length]:"";
  $("wR").textContent=ti===0?who:"";$("wB").textContent=ti===1?who:"";
  const tl=$("turn");tl.className="turnline "+t.cls;
  tl.textContent=t.name+(who?": "+who+", your turn":", your turn");
  $("qtext").textContent=q.q;
  $("fig").innerHTML=q.fig?figure(q.fig):"";
  const idx=shuffle([0,1,2,3]);
  $("opts").innerHTML="";
  idx.forEach((oi,k)=>{
    const b=document.createElement("button");b.className="opt";b.dataset.ok=(oi===q.a)?"1":"0";
    b.innerHTML=`<span class="l">${"ABCD"[k]}</span><span>${q.o[oi]}</span>`;
    b.onclick=()=>answer(b);$("opts").appendChild(b);
  });
  $("msg").textContent="";$("msg").className="msg";$("why").textContent="";$("next").style.display="none";
}
function answer(btn){
  if(locked)return;locked=true;
  const q=order[qi],ti=qi%2,t=teams[ti],ok=btn.dataset.ok==="1";
  document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.dataset.ok==="1")o.classList.add("good")});
  if(ok){
    t.score++;const p=$(ti?"pB":"pR");p.textContent=t.score;p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump");
    $("msg").textContent="Goal! Correct.";$("msg").className="msg ok";sndOk();flash("#1E9E57");
  }else{
    btn.classList.add("wrong");$("msg").textContent="Not this time.";$("msg").className="msg no";sndNo();flash("#C62828");
  }
  $("why").textContent=q.why;
  t.i++;
  $("next").textContent=(qi===order.length-1)?"See result":"Next question";$("next").style.display="";
}
$("next").onclick=()=>{qi++;if(qi>=order.length)finish();else loadQ()};
function flash(c){const f=$("flash");f.style.background=c;f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}

function finish(){
  const [r,b]=teams;
  $("fR").innerHTML=`<div>${r.name}</div><div class="big">${r.score}</div>`;
  $("fB").innerHTML=`<div>${b.name}</div><div class="big">${b.score}</div>`;
  $("fR").classList.toggle("win",r.score>b.score);$("fB").classList.toggle("win",b.score>r.score);
  $("endTitle").textContent=r.score===b.score?"It is a draw!":(r.score>b.score?r.name:b.name)+" win!";
  show("end");sndWin();
}
$("again").onclick=startGame;
$("home").onclick=()=>show("setup");
$("quit").onclick=()=>{if(confirm("Go back to the start screen? The score will be lost."))show("setup")};
$("mute").onclick=()=>{soundOn=!soundOn;$("mute").textContent="Sound: "+(soundOn?"on":"off")};
</script>
</body>
</html>
