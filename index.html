<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1033"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Geometry Showdown - The Shape Rescue</title>
<style>
:root{--ink:#0b1033;--v1:#150d52;--v2:#33198a;--v3:#6a2cb8;--cy:#38e8ff;--pk:#ff4f9a;--gold:#ffd23f;--grn:#2ee6a6;--red:#ff5d6c;--navy:#1b2a6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:min(1.25vw,2.2vh)}
@media (orientation:portrait){html{font-size:2.1vw}}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI",Verdana,sans-serif;background:var(--ink);color:var(--navy);user-select:none;-webkit-user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:.15rem solid #fff;border-radius:3rem;background:linear-gradient(#fff,#e3e8ff);padding:.7rem 1.3rem;font-weight:800;min-height:3rem;box-shadow:0 .28rem 0 rgba(10,10,60,.45);touch-action:manipulation;transition:transform .12s,filter .12s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active{transform:translateY(.15rem);box-shadow:0 .1rem 0 rgba(10,10,60,.45)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:.25rem solid var(--gold);outline-offset:.1rem}
button:disabled{opacity:.45;cursor:default}
.primary{background:linear-gradient(#ff6fb0,#d81b6a);color:#fff;font-size:1.5rem;padding:.9rem 2.2rem;border-color:#ffd0e6;box-shadow:0 .35rem 0 #7d0e42,0 0 1.4rem rgba(255,79,154,.55)}
.gold{background:linear-gradient(#ffe27a,#ffb300);color:#3b2600;border-color:#fff3c4;box-shadow:0 .35rem 0 #a56d00,0 0 1.4rem rgba(255,210,63,.5)}
.danger{background:linear-gradient(#ff7a85,#d63446);color:#fff}
.on{background:linear-gradient(#2ee6a6,#12a577)!important;color:#05301f}
.big{font-size:1.7rem;padding:.8rem 2rem;min-width:min(26rem,86vw)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;padding:.4rem .8rem;background:linear-gradient(90deg,#0b1033,#2a1a6e);border-bottom:.2rem solid var(--cy);color:#fff;flex:none;z-index:5}
#bar button{min-height:2.6rem;padding:.3rem .9rem;color:var(--ink)}
#who{font-size:1.4rem;font-weight:900;color:var(--cy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.stat{background:linear-gradient(#b9f6ff,#38e8ff);color:var(--ink);border-radius:2rem;padding:.35rem .9rem;font-weight:900;white-space:nowrap}
#dots{display:flex;gap:.35rem;margin:0 auto}
#dots i{width:1.5rem;height:1.5rem;border-radius:50%;border:.15rem solid #fff;font:bold .8rem/1.2rem sans-serif;text-align:center;font-style:normal}
#dots i.d{background:var(--grn);color:#05301f}#dots i.c{background:var(--pk)}
#view{flex:1;position:relative;overflow:hidden;background:linear-gradient(135deg,#0b1033,#2a1a6e 50%,#4b1f8f);background-size:200% 200%;animation:bgmove 18s ease-in-out infinite alternate}
@keyframes bgmove{to{background-position:100% 100%}}
#foot{flex:none;text-align:center;font-size:.85rem;padding:.2rem;background:#0b1033;color:#a7b4ff;border-top:.12rem solid #2a1a6e}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:1rem;padding:1rem;text-align:center;overflow:auto;z-index:2}
.screen>.card{flex-shrink:0;position:relative;z-index:1}
.card{background:linear-gradient(rgba(255,255,255,.97),rgba(233,238,255,.97));border:.22rem solid var(--cy);border-radius:2.4rem .9rem;padding:1.3rem 1.8rem;box-shadow:0 .8rem 2rem rgba(0,0,30,.55),0 0 0 .4rem rgba(255,255,255,.18),0 0 2.4rem rgba(56,232,255,.35);max-width:62rem;animation:pop .35s ease}
h1{font-size:3.6rem;line-height:1.05}h2{font-size:2.2rem}h3{font-size:1.4rem}
p{font-size:1.3rem;line-height:1.4}
.small{font-size:1rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:.7rem;align-items:center}
.wide{width:100%}
.err{color:#c4162f;font-weight:800}
.badge{background:linear-gradient(#d8fff4,#9af3d9);border-radius:2rem;padding:.4rem 1rem;font-weight:800;font-size:1.05rem}
input#code,input.txt{font-size:1.8rem;text-align:center;border:.22rem solid var(--v3);border-radius:3rem;padding:.4rem 1rem;background:#fff}
input#code{text-transform:uppercase;letter-spacing:.15em;width:15rem}
textarea.txt{font-size:1.2rem;border:.22rem solid var(--v3);border-radius:1.2rem;padding:.6rem;width:min(34rem,86vw);height:9rem;background:#fff;text-align:left;user-select:text;-webkit-user-select:text}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes bob{50%{transform:translateY(-.7rem)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes floaty{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3rem) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes shoot{0%{transform:translate(0,0) rotate(30deg);opacity:0}8%{opacity:1}100%{transform:translate(-70vw,50vh) rotate(30deg);opacity:0}}
@keyframes letter{0%,40%,100%{transform:none}20%{transform:translateY(-.6rem) scale(1.08)}}
@keyframes pulse{50%{box-shadow:0 .35rem 0 #7d0e42,0 0 0 .8rem rgba(255,79,154,.4)}}
@keyframes flow{to{stroke-dashoffset:-60}}
@keyframes glow{50%{filter:drop-shadow(0 0 1rem var(--gold)) brightness(1.2);border-color:var(--gold)}}
@keyframes shake{25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
@keyframes rise{to{transform:translateY(-110vh)}}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes fxpop{0%{transform:scale(.3);opacity:0}40%{opacity:1}100%{transform:scale(1.7) translateY(-3rem);opacity:0}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.flow{stroke-dasharray:14 16;animation:flow 1s linear infinite}
.shake{animation:shake .4s}
.glow{animation:glow .6s ease 4}
.scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
.shape{position:absolute;color:var(--cy);animation:floaty 14s ease-in-out infinite;filter:drop-shadow(0 0 .5rem currentColor);opacity:.8}
.shoot{position:absolute;width:9rem;height:.18rem;background:linear-gradient(90deg,transparent,#fff);animation:shoot 5s linear infinite;opacity:0}
.planet{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb3d9,#a83292 60%,#4a1a6e);box-shadow:0 0 3rem rgba(255,79,154,.5)}
.ring{position:absolute;border:.5rem solid rgba(255,210,63,.55);border-radius:50%;transform:rotateX(72deg) rotate(-12deg)}
.proto{position:absolute;left:50%;bottom:-32vh;width:90vh;height:90vh;margin-left:-45vh;opacity:.2;animation:spin 90s linear infinite}
.home .card{background:rgba(240,244,255,.92);max-width:36rem;padding:1rem 1.6rem;gap:.5rem}
.home h1{font-size:3rem}
.home .primary{animation:pulse 1.6s ease-in-out infinite}
.title{font-weight:900;letter-spacing:.03em;color:#2a1a8f;text-shadow:0 .18rem 0 #b9f6ff}
.title span{display:inline-block;animation:letter 2.4s ease-in-out infinite}
.title span:nth-child(even){color:#d81b6a;text-shadow:0 .18rem 0 #ffd0e6}
.title .sub{display:block;animation:none;font-size:1.3rem;color:var(--ink);text-shadow:none;letter-spacing:.12em;margin-top:.2rem}
.mascot{width:5rem;filter:drop-shadow(0 0 1rem rgba(56,232,255,.9))}
.act{position:absolute;inset:0;display:flex;flex-direction:column;padding:.6rem .9rem;gap:.5rem;z-index:2}
.ask{background:linear-gradient(90deg,#2a1a8f,#6a2cb8);color:#fff;border:.15rem solid var(--cy);border-radius:3rem;padding:.55rem 1.2rem;font-size:1.4rem;font-weight:900;text-align:center;flex:none;box-shadow:0 .2rem .8rem rgba(0,0,30,.4)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;gap:1rem}
.stage>svg{width:100%;height:100%}
.tray{flex:none;display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;min-height:4rem;align-items:center}
.tile{background:linear-gradient(#fff3c4,#ffd277);border:.15rem solid #fff;border-radius:1.8rem .6rem;padding:.7rem 1.2rem;font-weight:900;font-size:1.35rem;touch-action:none;cursor:grab;box-shadow:0 .28rem 0 #b5762a;max-width:24rem;text-align:center;color:var(--ink)}
.tile svg{width:13rem;height:auto;display:block}
.tile.sel{background:linear-gradient(#ff6fb0,#d81b6a);color:#fff;transform:scale(1.06)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg)}
.zones{display:grid;gap:.7rem;width:100%;height:100%}
.zone{background:rgba(255,255,255,.95);border:.25rem dashed var(--v3);border-radius:1.6rem .6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.4rem;text-align:center;font-weight:900;font-size:1.25rem;min-height:0;overflow:hidden;cursor:pointer}
.zone svg{flex:1;min-height:0;width:100%}
.zone .got{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center}
.zone .got b{background:var(--v3);color:#fff;border-radius:.6rem;padding:.2rem .6rem;animation:pop .3s}
.fig svg{height:min(30vh,15rem);width:auto;max-width:90vw;border-radius:1rem}
.opt{font-size:1.5rem;max-width:26rem}
.need{width:9rem;font-size:2rem;min-height:4.5rem}
.need.pick{background:linear-gradient(#ff6fb0,#d81b6a);color:#fff;transform:scale(1.08)}
#fb{position:absolute;left:50%;bottom:.7rem;transform:translateX(-50%);width:min(94%,60rem);border-radius:1.1rem;padding:.8rem 1.2rem;font-size:1.3rem;font-weight:900;text-align:center;color:#fff;z-index:20;pointer-events:none;box-shadow:0 .4rem 1rem rgba(0,0,0,.4);animation:pop .25s}
#fb.good{background:#14a56f}#fb.bad{background:#b32b46}
#learn,#modal{position:absolute;inset:0;background:rgba(5,5,40,.78);display:flex;align-items:center;justify-content:center;z-index:30;padding:1rem}
#modal{position:fixed;z-index:60}
#modal .card{max-height:94vh;overflow:auto;text-align:center;min-width:min(30rem,90vw)}
table{border-collapse:collapse;width:100%;font-size:1.05rem}td,th{border-bottom:1px solid #bcd;padding:.35rem .7rem;text-align:left}
.bigname{font-size:6rem;font-weight:900;color:var(--v3);line-height:1.1;word-break:break-word}
.confetti{position:fixed;top:-2rem;width:.8rem;height:1.2rem;z-index:70;pointer-events:none;animation:conf 2.8s linear forwards}
.node{cursor:pointer}.node.lock{cursor:default}
.node:not(.lock) .nc{filter:drop-shadow(0 0 .6rem rgba(255,255,255,.95))}
.stamps{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;width:6.8rem;height:6.8rem;border-radius:50%;font-size:2rem;border:.22rem double var(--v3);padding:.3rem;transform:rotate(-6deg);color:var(--v2);background:#f0eaff}
.stamp:nth-child(even){transform:rotate(5deg);border-color:#d81b6a;color:#a81f50;background:#fff0f4}
.stamp small{font-size:.62rem;font-weight:800;line-height:1.1}.stamp.off{opacity:.4;filter:grayscale(1)}
.fxlayer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fx{position:absolute;animation:fxpop 2s ease-in-out infinite}
.trophy{font-size:5rem;filter:drop-shadow(0 0 2rem var(--cy))}
.megacel{overflow-y:auto}
.tabs{display:flex;gap:.5rem;justify-content:center}
body.solo #bTeach{display:none}
@media (orientation:portrait){html{font-size:3.6vw}.zones{grid-template-columns:repeat(2,1fr)!important}}
@media (max-width:700px){#bar button{padding:.25rem .6rem}.lbl,#dots{display:none}#who{max-width:38vw}h1{font-size:2.3rem}.home h1{font-size:2.4rem}.bigname{font-size:3.2rem}.card{padding:.9rem 1rem}p{font-size:1.1rem}.big{font-size:1.35rem;padding:.7rem 1rem}.ask{font-size:1.1rem}.tile{font-size:1.1rem}}
@media (max-height:520px) and (orientation:landscape){html{font-size:clamp(11px,3.7vh,16px)}.card{padding:.7rem 1.1rem}.screen{padding:.5rem;gap:.5rem}.home h1{font-size:2.2rem}.mascot{width:2.8rem}h1{font-size:2rem}.trophy{font-size:3rem}}
</style>
</head>
<body>
<div id="app"><div id="bar"></div><div id="view"></div>
<div id="foot">&copy; 2026 Geometry Showdown | Developed by AMSanjeev (Teach For India Fellow 2026&ndash;28)</div></div>
<script>
'use strict';
/* ================= CONFIG (same Firebase class database as RF Word Finder / Hydrosphere) ================= */
const FB={project:'maths-penalty-cup',key:'AIzaSyAMsz-GB8WmGNUYjod6fquQJMYBQPJeOGs'};
const fbUrl=c=>`https://firestore.googleapis.com/v1/projects/${FB.project}/databases/(default)/documents/classes/${c}?key=${FB.key}`;
const fmtC=c=>c.slice(0,4)+'-'+c.slice(4);
const RANKS=['Shape Rookie','Line Explorer','Angle Ace','Geometry Wizard','Geometry Hero'];
const MISSIONS=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const one=(...f)=>f[rnd(f.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let prefs=Object.assign({sound:true,music:true,full:false},store.get('gq_prefs',{}));
const savePrefs=()=>store.set('gq_prefs',prefs);

/* ================= AUDIO ================= */
const Snd={ctx:null,amb:null,timer:null,
 init(){try{if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.ctx=new A()}if(this.ctx.state==='suspended')this.ctx.resume();this.music()}catch(e){}},
 tone(f,d,t=0,v=.12,type='sine'){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.05)},
 play(n){if(!prefs.sound||!this.ctx)return;try{
  if(n==='click')this.tone(520,.08,0,.08,'triangle');
  if(n==='good'){this.tone(660,.14);this.tone(990,.2,.09)}
  if(n==='bad'){this.tone(240,.22,0,.1,'triangle');this.tone(190,.28,.12,.1,'triangle')}
  if(n==='zap'){this.tone(300,.1,0,.1,'square');this.tone(900,.18,.08,.08,'square')}
  if(n==='badge')[523,659,784,1047].forEach((f,i)=>this.tone(f,.28,i*.11));
  if(n==='party')[523,523,523,659,784,659,784,1047].forEach((f,i)=>this.tone(f,.25,i*.14,.14,'triangle'));
 }catch(e){}},
 music(){const c=this.ctx;if(!c)return;
  if(prefs.music&&!this.timer){const N=[262,330,392,523,392,330,294,392,440,587,440,392];let i=0;this.timer=setInterval(()=>{if(document.hidden||!prefs.music)return;this.tone(N[i++%12],.9,0,.03,'sine');if(i%4===0)this.tone(N[i%12]/2,1.2,0,.025,'triangle')},650)}
  if(!prefs.music&&this.timer){clearInterval(this.timer);this.timer=null}}
};
addEventListener('pointerdown',()=>Snd.init(),{once:true});
document.addEventListener('click',e=>{if(e.target.closest('button'))Snd.play('click')});

/* ================= CLASS LOADER (same logic as Hydrosphere / Maths Champion) ================= */
const CC={code:'',lib:null,cls:'',msg:'',busy:false,tab:'auto',manual:store.get('gq_manual','')};
try{CC.code=localStorage.getItem('pk_code')||''}catch(e){}
async function loadCode(c){
 c=(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(c.length!=8){CC.msg='A class code has 8 letters and numbers.';return showSetup()}
 CC.busy=true;CC.msg='Loading...';showSetup();
 try{
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  const r=await fetch(fbUrl(c),{signal:ctl.signal});clearTimeout(to);
  if(!r.ok){CC.msg=r.status==404?'Code not found. Check it and try again.':'Could not load (error '+r.status+').'}
  else{
   let lib=null;try{const j=await r.json();lib=JSON.parse(j.fields.lib.stringValue)}catch(e){}
   if(!lib||typeof lib!=='object'||Array.isArray(lib))CC.msg='This code has data the game cannot read. Open your class list and save it again.';
   else{CC.lib=lib;CC.code=c;try{localStorage.setItem('pk_code',c)}catch(e){}
    const ks=Object.keys(lib);CC.cls=ks.length==1?ks[0]:(Object.prototype.hasOwnProperty.call(lib,CC.cls)?CC.cls:'');CC.msg=ks.length?'':'That code has no classes yet.'}
  }
 }catch(e){CC.msg='Could not reach the cloud. Check the internet and try again.'}
 CC.busy=false;showSetup();
}
function readClass(k){
 const c=CC.lib&&CC.lib[k],list=[],seen=new Set(),repeats=[];
 if(c&&Array.isArray(c.g))c.g.slice(0,c.n).forEach(g=>String((g&&g.txt)||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!seen.has(n)){seen.add(n);list.push({n,team:g.name})}else repeats.push(n)}));
 return{list,repeats};
}

/* ================= STATE ================= */
/* G.mode: 'solo' | 'class' | 'preview'.  G.t is the current explorer's turn object. */
let SO=store.get('gq_solo',null),SES=store.get('gq_session',null),G={mode:'',t:null},M=null,epoch=0,inPlay=false,picked=null,fbTimer;
if(SES&&!(Array.isArray(SES.names)&&Array.isArray(SES.done)&&Array.isArray(SES.skip)&&SES.adv))SES=null;
if(SO&&!(SO.name&&Array.isArray(SO.mdone)))SO=null;
const newTurn=(name,m=0)=>({name,m,mission:m,done:false,pts:0,gems:0,right:0,total:0,badges:[]});
const remaining=()=>SES?SES.names.filter(n=>!SES.done.includes(n)&&!SES.skip.includes(n)):[];
const cur=()=>G.t;
const isSolo=()=>G.mode==='solo';
function save(){if(G.mode==='solo')store.set('gq_solo',SO);else if(G.mode==='class')store.set('gq_session',SES)}
const later=(fn,ms)=>{const e=epoch;setTimeout(()=>{if(e===epoch)fn()},ms)};
function view(html,play=false){epoch++;inPlay=play;closeModal();$$('.ghost').forEach(g=>g.remove());$('#view').innerHTML=html;drawBar()}
function modal(html){closeModal();const d=document.createElement('div');d.id='modal';d.innerHTML=`<div class="card col">${html}</div>`;document.body.appendChild(d)}
function closeModal(){const m=$('#modal');if(m)m.remove()}
function ask2(msg,yes,fn){modal(`<h2>${msg}</h2><div class="row"><button class="danger" id="yes">${yes}</button><button id="no">Cancel</button></div>`);$('#yes').onclick=()=>{closeModal();fn()};$('#no').onclick=openTeacher}
function confetti(){for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.cssText=`left:${rnd(100)}vw;background:${['#38e8ff','#ff4f9a','#ffd23f','#fff','#2ee6a6'][i%5]};animation-delay:${Math.random()*.9}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
const rankOf=t=>{if(!t.total)return RANKS[0];const r=t.right/t.total;return RANKS[r<.4?1:r<.6?2:r<.8?3:4]};
const stamped=(t,i)=>isSolo()?SO.mdone.includes(i):i<t.m;
const stampCount=t=>MISSIONS.filter((_,i)=>stamped(t,i)).length;

/* ================= TOP BAR ================= */
function drawBar(){
 document.body.classList.toggle('solo',G.mode==='solo');
 const t=inPlay?cur():null;
 let h=`<button id="bBack">${inPlay?'&#11013; Map':'&#127968; Menu'}</button>`;
 if(t)h+=`<span id="who">&#129517; ${esc(t.name)}</span><div id="dots">${MISSIONS.map((m,i)=>`<i class="${stamped(t,i)?'d':i===t.m?'c':''}">${i+1}</i>`).join('')}</div><span class="stat" id="sGem">&#128142; ${t.gems}</span><span class="stat" id="sPts">&#11088; ${t.pts}</span><button id="bPass">&#128706; ${stampCount(t)}/${MISSIONS.length}</button>`;
 else h+='<span style="margin-right:auto;font-weight:900">Geometry Showdown &ndash; The Shape Rescue</span>';
 h+=`<button id="bSnd">${prefs.sound?'&#128266;':'&#128263;'}<span class="lbl"> Sound</span></button><button id="bMus">${prefs.music?'&#127925;':'&#128683;'}<span class="lbl"> Music</span></button><button id="bFull">&#9974;</button><button id="bTeach" title="Teacher menu (hold)">&#9881;&#65039;</button>`;
 $('#bar').innerHTML=h;
 if($('#bPass'))$('#bPass').onclick=showPassport;

/* ================= FIGURES (SVG) ================= */
const INK='#1b2a6b',PINK='#e0306e',CY='#0aa3c2',GOLD='#f5b301';
const S2=(vb,inner)=>`<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
const PANEL=(w,h)=>`<rect width="${w}" height="${h}" rx="14" fill="#f4f7ff"/>`;
const T=(x,y,s,fs=20)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${INK}">${s}</text>`;
const ah=(x,y,deg,c=INK,s=11)=>{const a=deg*Math.PI/180,p=d=>`${x-s*Math.cos(a+d)},${y+s*Math.sin(a+d)}`;return `<polygon points="${x},${y} ${p(.4)} ${p(-.4)}" fill="${c}"/>`};
const ln=(x1,y1,x2,y2,c=INK,w=4)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const dt=(x,y,c=INK,r=6)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
function sierBody(x,y,size,dep,fill){if(dep===0){const h=size*Math.sqrt(3)/2;return `<polygon points="${x},${y} ${x+size},${y} ${x+size/2},${y-h}" fill="${fill}" stroke="${INK}" stroke-width="1"/>`}const s=size/2,h=size*Math.sqrt(3)/4;return sierBody(x,y,s,dep-1,fill)+sierBody(x+s,y,s,dep-1,fill)+sierBody(x+s/2,y-h,s,dep-1,fill)}
function treeBody(x,y,len,ang,d){if(!d)return'';const x2=x+len*Math.cos(ang),y2=y-len*Math.sin(ang);return ln(x,y,x2,y2,d>2?'#7a4a20':'#1ea35a',d*1.2)+treeBody(x2,y2,len*.72,ang+.5,d-1)+treeBody(x2,y2,len*.72,ang-.5,d-1)}
const pic={
 point:()=>S2('0 0 200 110',PANEL(200,110)+dt(100,48,INK,8)+T(100,90,'A',24)),
 line:()=>S2('0 0 200 110',PANEL(200,110)+ln(18,50,182,50)+ah(186,50,0)+ah(14,50,180)+dt(70,50)+dt(130,50)+T(70,86,'P',22)+T(130,86,'Q',22)),
 seg:()=>S2('0 0 200 110',PANEL(200,110)+ln(34,50,166,50)+dt(34,50,INK,8)+dt(166,50,INK,8)+T(34,86,'M',22)+T(166,86,'N',22)),
 ray:()=>S2('0 0 200 110',PANEL(200,110)+ln(32,50,180,50)+ah(186,50,0)+dt(32,50,INK,8)+dt(110,50)+T(32,86,'R',22)+T(110,86,'S',22)),
 ang:deg=>{const vx=deg<=90?50:110,vy=108,L=90,ex=vx+L*Math.cos(deg*Math.PI/180),ey=vy-L*Math.sin(deg*Math.PI/180);
  let a=ln(vx,vy,vx+L,vy)+ah(vx+L+4,vy,0)+ln(vx,vy,ex,ey,PINK)+ah(ex+4*Math.cos(deg*Math.PI/180),ey-4*Math.sin(deg*Math.PI/180),deg,PINK)+dt(vx,vy,INK,6);
  if(deg===90)a+=`<path d="M${vx+16} ${vy} V${vy-16} H${vx}" fill="none" stroke="${INK}" stroke-width="3"/>`;
  else{const r=24,r1=deg*Math.PI/180;a+=`<path d="M${vx+r} ${vy} A${r} ${r} 0 0 0 ${vx+r*Math.cos(r1)} ${vy-r*Math.sin(r1)}" fill="none" stroke="${INK}" stroke-width="3"/>`}
  return S2('0 0 220 130',PANEL(220,130)+a)},
 sier:(n,lab)=>S2('0 0 200 150',PANEL(200,150)+sierBody(30,124,140,n,'#ff6fb0')+(lab?T(100,144,lab,15):'')),
 tree:()=>S2('0 0 200 130',PANEL(200,130)+treeBody(100,122,30,Math.PI/2,6)),
 sq:()=>S2('0 0 200 130',PANEL(200,130)+`<rect x="60" y="25" width="80" height="80" fill="#9ad8ff" stroke="${INK}" stroke-width="3"/>`),
 circ:()=>S2('0 0 200 130',PANEL(200,130)+`<circle cx="100" cy="65" r="42" fill="#ffe27a" stroke="${INK}" stroke-width="3"/>`)
};

  c=>`<polygon points="50,10 92,88 8,88" fill="none" stroke="${c}" stroke-width="5"/>`,

function draggable(el,onDrop){
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();let moved=false,ghost=null;const sx=e.clientX,sy=e.clientY,id=e.pointerId,ep=epoch;
  const mv=ev=>{if(ev.pointerId!==id)return;if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<10)return;
   if(!moved){moved=true;ghost=el.cloneNode(true);ghost.classList.add('ghost');document.body.appendChild(ghost);el.style.opacity=.35}
   ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'};
  const up=ev=>{if(ev.pointerId!==id)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(ghost)ghost.remove();el.style.opacity='';
   if(ep!==epoch||ev.type==='pointercancel')return;
   if(moved){const hit=document.elementFromPoint(ev.clientX,ev.clientY),z=hit&&hit.closest('[data-zone]');if(z){clearPick();onDrop(el,z)}}
   else{const was=el.classList.contains('sel');clearPick();if(!was){el.classList.add('sel');picked={el,onDrop};Snd.play('click')}}};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
 });
}
function clearPick(){if(picked){picked.el.classList.remove('sel');picked=null}$$('.tile.sel').forEach(e=>e.classList.remove('sel'))}

   <path id="arcp" d="" fill="none" stroke="#ff4f9a" stroke-width="6"/><path id="rm" d="M${VX+34} ${VY} V${VY-34} H${VX}" fill="none" stroke="#ffd23f" stroke-width="5" opacity="0"/>

  const svg=$('#am'),upd=()=>{const ex=VX+L*Math.cos(th*Math.PI/180),ey=VY-L*Math.sin(th*Math.PI/180);

   $('#rd').textContent=g?`Pink ${Math.round(th-g)}\u00B0   Total ${Math.round(th)}\u00B0`:`${Math.round(th)}\u00B0`;svg.dataset.th=Math.round(th)};
  upd();

  svg.onpointerdown=e=>{on=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}set(e)};svg.onpointermove=e=>{if(on)set(e)};svg.onpointerup=svg.onpointercancel=()=>on=false;
  a.tray.innerHTML='<button class="gold big" id="lock">Lock it in</button>';

  if(b.disabled)return;

  if(first===b){b.classList.remove('pick');first=null;return}
  const x=+first.dataset.v,y=+b.dataset.v;
  if(x+y===total){first.classList.remove('pick');[first,b].forEach(e=>{e.classList.add('on');e.disabled=true});good(`${x}\u00B0 + ${y}\u00B0 = ${total}\u00B0.`,missed);missed=false;Snd.play('zap');first=null;if(!--left)a.done(learn)}
  else{missed=true;bad(`${x}\u00B0 + ${y}\u00B0 = ${x+y}\u00B0, not ${total}\u00B0.`);first.classList.remove('pick');first=null}
 });
}
function fractalGrow(a){
 let n=0;a.ask('Grow the fractal! Tap the button to repeat the same simple step.');
 const lab=['Step I','Step II','Step III','Step IV'];
 const draw=()=>{a.stage.innerHTML=pic.sier(n,lab[n]);$('#cnt').textContent=`Coloured triangles: ${Math.pow(3,n)}`};
 a.tray.innerHTML='<span class="badge" id="cnt"></span><button class="primary" id="grow">Grow &#10024;</button>';draw();
 $('#grow').onclick=()=>{if(n>=2){$('#grow').disabled=true}n++;Snd.play('zap');draw();
  if(n===3){feedback(true,'Same shape, smaller and smaller. That is self-similarity!');
   later(()=>decide(a,[{q:'How many coloured triangles will Step IV have?',fig:pic.sier(3,'Step III'),opts:['12','18','27','81'],a:2,why:'Each step multiplies the triangles by 3: 1, 3, 9, then 27.'}],'A fractal repeats a simple step again and again, getting smaller each time.'),1700)}};
}
